<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>HandyPro Services – Your Local Craftsman</title>
<style>
body {
  margin: 0;
  font-family: 'Helvetica Neue', Arial, sans-serif;
  background: #f5f5f5;
  color: #333;
}

header {
  background: url('https://images.pexels.com/photos/1643386/pexels-photo-1643386.jpeg?auto=compress&cs=tinysrgb&w=1600') center/cover no-repeat;
  color: white;
  padding: 100px 20px;
  text-align: center;
  position: relative;
}
header::after {
  content: '';
  position: absolute;
  inset: 0;
  background: rgba(0,0,0,0.5);
}
header h1, header p {
  position: relative;
  z-index: 1;
  margin: 0;
}
header h1 {
  font-size: 3em;
  margin-bottom: 10px;
}
header p {
  font-size: 1.3em;
}

section {
  max-width: 1200px;
  margin: 50px auto;
  padding: 0 20px;
}

h2 {
  text-align: center;
  color: #2a7f62;
  margin-bottom: 40px;
}

/* SERVICES GRID */
.services-grid {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
  gap: 30px;
}

.service-card {
  perspective: 1000px;
}

.card-inner {
  position: relative;
  width: 100%;
  height: 300px;
  transition: transform 0.8s;
  transform-style: preserve-3d;
  border-radius: 16px;
  box-shadow: 0 6px 20px rgba(0,0,0,0.1);
}

.service-card:hover .card-inner {
  transform: rotateY(180deg);
}

.card-front, .card-back {
  position: absolute;
  width: 100%;
  height: 100%;
  border-radius: 16px;
  backface-visibility: hidden;
  overflow: hidden;
}

.card-front {
  background: #fff;
  text-align: center;
  display: flex;
  flex-direction: column;
  justify-content: center;
  align-items: center;
}

.card-front img {
  width: 100%;
  height: 150px;
  object-fit: cover;
}

.card-front h3 {
  margin: 15px 0 0 0;
  font-size: 1.3em;
  color: #2a7f62;
}

.card-back {
  background: #2a7f62;
  color: white;
  transform: rotateY(180deg);
  padding: 20px;
  box-sizing: border-box;
  display: flex;
  flex-direction: column;
  justify-content: center;
}

.card-back h4 {
  margin-top: 0;
}

.card-back ul {
  padding-left: 20px;
}

/* ABOUT */
.about {
  display: flex;
  gap: 40px;
  align-items: center;
  flex-wrap: wrap;
}

.about img {
  width: 100%;
  max-width: 500px;
  border-radius: 16px;
}

.about-text {
  flex: 1;
}

/* BUTTONS */
button {
  background-color: #2a7f62;
  color: white;
  padding: 12px 25px;
  border: none;
  border-radius: 8px;
  cursor: pointer;
  font-size: 1em;
  margin-top: 20px;
}

button:hover {
  background-color: #237254;
}

/* MODAL FORM */
.modal {
  display: none;
  position: fixed;
  z-index: 100;
  left: 0; top: 0;
  width: 100%; height: 100%;
  background-color: rgba(0,0,0,0.6);
  justify-content: center;
  align-items: center;
}

.modal-content {
  background: #fff;
  padding: 30px;
  border-radius: 16px;
  max-width: 500px;
  width: 90%;
  position: relative;
}

.close {
  position: absolute;
  right: 15px;
  top: 15px;
  font-size: 1.5em;
  cursor: pointer;
  color: #333;
}

.modal-content h3 {
  margin-top: 0;
}

.modal-content input, .modal-content textarea {
  width: 100%;
  padding: 10px;
  margin-top: 10px;
  margin-bottom: 15px;
  border-radius: 6px;
  border: 1px solid #ccc;
  box-sizing: border-box;
}

.modal-content input[type="submit"] {
  background-color: #2a7f62;
  color: white;
  border: none;
  cursor: pointer;
}

.modal-content input[type="submit"]:hover {
  background-color: #237254;
}

footer {
  background: #2a7f62;
  color: white;
  text-align: center;
  padding: 30px;
  margin-top: 50px;
}
</style>
</head>
<body>

<header>
  <h1>HandyPro Services</h1>
  <p>Professional craftsmanship for your home & business</p>
</header>

<section>
  <h2>Our Services</h2>
  <div class="services-grid" id="servicesGrid"></div>
</section>

<section>
  <h2>About Us</h2>
